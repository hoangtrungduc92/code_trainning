<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caculator</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div id="app">
        <div id="top">
            <div id="exp"></div>
            <div id="result">0</div>
        </div>
       
        <div id="button">
            <div id="row-1">
                <div class="btn" id="op">(</div>
                <div class="btn" id="cl">)</div>
                <div class="btn" id="per">%</div>
                <div class="btn" id="ce">CE</div>
            </div>
            <div id="row-2">
                <div class="btn" id="7">7</div>
                <div class="btn" id="8">8</div>
                <div class="btn" id="9">9</div>
                <div class="btn" id="div">:</div>
            </div>
            <div id="row-3">
                <div class="btn" id="4">4</div>
                <div class="btn" id="5">5</div>
                <div class="btn" id="6">6</div>
                <div class="btn" id="mul">x</div>
            </div>
           <div id="row-4">
                <div class="btn" id="1">1</div>
                <div class="btn" id="2">2</div>
                <div class="btn" id="3">3</div>
                <div class="btn" id="sub">-</div>
           </div>
            <div id="row-5">
                <div class="btn" id="0">0</div>
                <div class="btn" id="poi">.</div>
                <div class="btn" id="equ">=</div>
                <div class="btn" id="add">+</div>
            </div>
            
        </div>
        
   </div>
   <script src="app.js"></script>
</body>
</html>
